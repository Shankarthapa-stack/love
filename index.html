<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forever Together ❤️</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #ffe0e6, #ffb3c6);
            color: #333333;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }
        
        /* Floating Animated Background (Clear, Dark & Solid GIFs) */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .float-item {
            position: absolute;
            animation: floatUp 10s infinite ease-in-out;
            opacity: 1 !important; /* Full Dark and Clear */
        }
        .float-item.down {
            animation: floatDown 11s infinite ease-in-out;
        }
        .float-gif {
            width: 90px;
            height: auto;
            border-radius: 15px;
            border: 2px solid rgba(255, 77, 109, 0.4);
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.25);
            display: block;
        }
        .float-heart {
            font-size: 2.2rem;
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.2));
        }

        @keyframes floatUp {
            0% { transform: translateY(105vh) rotate(-5deg) scale(0.9); opacity: 0.2; }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { transform: translateY(-15vh) rotate(10deg) scale(1.1); opacity: 0.2; }
        }
        @keyframes floatDown {
            0% { transform: translateY(-15vh) rotate(10deg) scale(1.1); opacity: 0.2; }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { transform: translateY(105vh) rotate(-5deg) scale(0.9); opacity: 0.2; }
        }

        .container {
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(8px);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 12px 30px rgba(255, 77, 109, 0.25);
            text-align: center;
            max-width: 420px;
            width: 100%;
            position: relative;
            z-index: 1;
        }
        .main-heading {
            color: #d90429;
            font-size: 1.7rem;
            margin-bottom: 6px;
            font-weight: 700;
        }
        .special-quote {
            font-size: 1.05rem;
            font-weight: 600;
            color: #a4133c;
            margin-bottom: 4px;
        }
        .main-message {
            font-size: 0.9rem;
            color: #555555;
            margin-bottom: 20px;
        }
        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-bottom: 15px;
        }
        button {
            background: #ff4d6d;
            color: white;
            border: none;
            padding: 9px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 10px rgba(255, 77, 109, 0.3);
        }
        button:hover {
            background: #c9184a;
            transform: translateY(-2px);
        }
        .display-box {
            min-height: 60px;
            padding: 12px;
            background: #fff0f3;
            border-radius: 12px;
            border-left: 4px solid #ff4d6d;
            font-style: italic;
            font-size: 0.92rem;
            color: #590d22;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .why-you-section {
            border-top: 1px dashed #ff8fa3;
            padding-top: 18px;
        }
        .why-you-section h2 {
            color: #d90429;
            font-size: 1.25rem;
            margin-bottom: 12px;
        }
        .photo-card {
            margin-top: 15px;
            padding: 10px;
            background: #fff5f6;
            border-radius: 15px;
            display: none;
            animation: fadeIn 0.4s ease-in-out;
        }
        .photo-card img {
            width: 100%;
            max-height: 220px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 8px;
        }
        .photo-card p {
            font-size: 0.9rem;
            font-weight: 600;
            color: #590d22;
        }
        
        /* Admin Link Generator Box */
        .admin-panel {
            margin-top: 25px;
            padding: 15px;
            background: #fdfdfd;
            border: 1px solid #ffccd5;
            border-radius: 12px;
            text-align: left;
        }
        .admin-panel h3 {
            font-size: 0.95rem;
            color: #c9184a;
            margin-bottom: 8px;
        }
        .admin-panel input {
            width: 100%;
            padding: 8px;
            margin-bottom: 8px;
            border: 1px solid #ffccd5;
            border-radius: 6px;
            font-size: 0.85rem;
        }
        .admin-panel button {
            width: 100%;
            padding: 8px;
        }
        .generated-url {
            margin-top: 8px;
            word-break: break-all;
            font-size: 0.8rem;
            color: #0077b6;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

<!-- Floating Background GIFs & Hearts (Dark & Solid) -->
<div class="bg-animation">
    <div class="float-item" style="left: 6%; animation-delay: 0s;">
        <img class="float-gif" src="https://media.giphy.com/media/ICOgUNjpvO0PC/giphy.gif" alt="Cat Cool">
    </div>
    <div class="float-item down" style="left: 24%; animation-delay: 2s;">
        <div class="float-heart">❤️</div>
    </div>
    <div class="float-item" style="left: 76%; animation-delay: 3s;">
        <img class="float-gif" src="https://media.giphy.com/media/MDJ9IbxxvDUQM/giphy.gif" alt="Cute Cat">
    </div>
    <div class="float-item down" style="left: 60%; animation-delay: 1s;">
        <img class="float-gif" src="https://media.giphy.com/media/vFKqnCdLPNOKc/giphy.gif" alt="Angry Cat">
    </div>
    <div class="float-item" style="left: 42%; animation-delay: 5s;">
        <div class="float-heart">💖</div>
    </div>
    <div class="float-item down" style="left: 86%; animation-delay: 4.5s;">
        <img class="float-gif" src="https://media.giphy.com/media/mlvseq9yvZhba/giphy.gif" alt="Cat Hug">
    </div>
</div>

<div class="container">
    <h1 class="main-heading">I Love You <span id="partnerName">Riya</span> ❤️</h1>
    <p class="special-quote">"I can't live without you ❤️"</p>
    <p class="main-message">Tum meri zindagi ka sabse khubsurat hissa ho...</p>

    <!-- Shayari Section -->
    <div class="btn-group">
        <button onclick="showShayari(1)">Pyari Shayari ✨</button>
        <button onclick="showShayari(2)">Pyaar Bhari Baatein 💌</button>
    </div>

    <div class="display-box" id="shayariBox">
        Upar kisi shayari button par click karein...
    </div>

    <!-- Why You Section -->
    <div class="why-you-section">
        <h2>Why You?</h2>
        <div class="btn-group">
            <button onclick="showPhoto('smile')">Your Smile 😊</button>
            <button onclick="showPhoto('eyes')">Your Eyes 👀</button>
            <button onclick="showPhoto('masti')">Your Masti 😜</button>
            <button onclick="showPhoto('other')">Other ✨</button>
        </div>

        <div class="photo-card" id="photoBox">
            <img id="displayImg" src="" alt="Memory">
            <p id="imgCaption"></p>
        </div>
    </div>

    <!-- Admin Link Generator Panel -->
    <div class="admin-panel" id="adminBox">
        <h3>🔗 Partner ke liye Link Banayein:</h3>
        <input type="text" id="inputPartnerName" placeholder="Partner ka naam daalein (e.g. Riya)">
        <button onclick="createShareLink()">Link Generate Karein</button>
        <div class="generated-url" id="linkOutput"></div>
    </div>
</div>

<script>
    // 1. URL Check
    const urlParams = new URLSearchParams(window.location.search);
    const partner = urlParams.get('to');

    if (partner) {
        document.getElementById('partnerName').innerText = partner;
        document.getElementById('adminBox').style.display = 'none';
    }

    // 2. Link Generator Logic
    function createShareLink() {
        const pName = document.getElementById('inputPartnerName').value.trim();

        if (!pName) {
            alert("Kripya partner ka naam likhein!");
            return;
        }

        const baseUrl = window.location.origin + window.location.pathname;
        const finalUrl = `${baseUrl}?to=${encodeURIComponent(pName)}`;

        document.getElementById('linkOutput').innerHTML = `
            <strong>Partner ko ye link bhejein:</strong><br>
            <a href="${finalUrl}" target="_blank">${finalUrl}</a>
        `;
    }

    // 3. Shayari Data
    const shayaris = {
        1: "Tere muskurane ka asar kuch aisa hua, ki dil ne dhadakna chhod kar sirf tujhe chaha...",
        2: "Zindagi ki har subah khoobsurat lagti hai, jab se tum meri zindagi ka hissa bane ho..."
    };

    function showShayari(id) {
        document.getElementById('shayariBox').innerText = shayaris[id];
    }

    // 4. Photos / GIFs Data
    const mediaData = {
        smile: {
            img: "https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=500&q=80",
            caption: "Tumhari ek muskaan mere pure din ko roshan kar deti hai 😊"
        },
        eyes: {
            img: "https://images.unsplash.com/photo-1544005313-94ddf0286df2?auto=format&fit=crop&w=500&q=80",
            caption: "In khoobsurat aankhon mein doob jane ka mann karta hai 👀❤️"
        },
        masti: {
            img: "https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=500&q=80",
            caption: "Tumhari natkhat aur pagal si baatein hi meri sabse badi khushi hain 😜"
        },
        other: {
            img: "https://images.unsplash.com/photo-1518199266791-5375a83190b7?auto=format&fit=crop&w=500&q=80",
            caption: "Bas tumhara hona hi meri zindagi ko mukammal banata hai ✨"
        }
    };

    function showPhoto(category) {
        const photoBox = document.getElementById('photoBox');
        const img = document.getElementById('displayImg');
        const caption = document.getElementById('imgCaption');

        img.src = mediaData[category].img;
        caption.innerText = mediaData[category].caption;
        photoBox.style.display = 'block';
    }
</script>

</body>
</html>
