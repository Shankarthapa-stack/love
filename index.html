<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Love ❤️</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #ffe6ea, #ffccd5);
            color: #4a4a4a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(255, 77, 109, 0.2);
            text-align: center;
            max-width: 480px;
            width: 100%;
        }
        h1 {
            color: #ff4d6d;
            font-size: 2rem;
            margin-bottom: 15px;
        }
        .main-message {
            font-size: 1.1rem;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }
        button {
            background: #ff4d6d;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 25px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 10px rgba(255, 77, 109, 0.3);
        }
        button:hover {
            background: #c9184a;
            transform: translateY(-2px);
        }
        .display-box {
            min-height: 70px;
            padding: 15px;
            background: #fff0f3;
            border-radius: 12px;
            border-left: 4px solid #ff4d6d;
            font-style: italic;
            font-size: 1rem;
            color: #590d22;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .why-you-section {
            border-top: 1px dashed #ffb3c1;
            padding-top: 20px;
            text-align: left;
        }
        .why-you-section h2 {
            color: #ff4d6d;
            font-size: 1.3rem;
            margin-bottom: 12px;
            text-align: center;
        }
        .reason-card {
            background: #fff5f6;
            padding: 10px 15px;
            border-radius: 10px;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>I Love You ❤️</h1>
    <p class="main-message">Tum meri zindagi ka sabse khubsurat hissa ho.</p>

    <div class="btn-group">
        <button onclick="showShayari(1)">Pyari Shayari ✨</button>
        <button onclick="showShayari(2)">Pyari Aankhein 👀</button>
        <button onclick="showShayari(3)">Tumhari Muskaan 😊</button>
    </div>

    <div class="display-box" id="shayariBox">
        Upar kisi bhi button par click karein...
    </div>

    <div class="why-you-section">
        <h2>Why You?</h2>
        <div class="reason-card">✨ <strong>Your Smile:</strong> Tumhari muskaan meri har pareshani ko door kar deti hai.</div>
        <div class="reason-card">✨ <strong>Your Eyes:</strong> Tumhari aankhein jisme pura jahan dikhta hai.</div>
    </div>
</div>

<script>
    const lines = {
        1: "Tere muskurane ka asar kuch aisa hua, ki dil ne dhadakna chhod kar sirf tujhe chaha...",
        2: "Teri aankhon ki gehrai mein doob jaane ko dil karta hai, inme jo noor hai wo kahin aur kahan...",
        3: "Teri ek muskaan par hum sab kuch haar baithe, tum hasti raho bas yahi dua karte hain..."
    };

    function showShayari(id) {
        document.getElementById('shayariBox').innerText = lines[id];
    }
</script>

</body>
</html>
