<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forever Together ❤️</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #ffe6ea, #ffccd5);
            color: #4a4a4a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }
        
        /* Floating Hearts Animation */
        .heart-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .floating-heart {
            position: absolute;
            color: rgba(255, 77, 109, 0.45);
            font-size: 1.5rem;
            animation: floatUp 8s infinite ease-in-out;
        }
        .floating-heart.down {
            animation: floatDown 9s infinite ease-in-out;
        }
        @keyframes floatUp {
            0% { transform: translateY(105vh) scale(0.8); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }
        @keyframes floatDown {
            0% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(105vh) scale(0.8); opacity: 0; }
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(5px);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(255, 77, 109, 0.2);
            text-align: center;
            max-width: 420px;
            width: 100%;
            position: relative;
            z-index: 1;
        }
        .couplename {
            color: #ff4d6d;
            font-size: 1.5rem;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .special-quote {
            font-size: 1.05rem;
            font-weight: 600;
            color: #c9184a;
            margin-bottom: 4px;
        }
        .main-message {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 20px;
        }
        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-bottom: 15px;
        }
        button {
            background: #ff4d6d;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 10px rgba(255, 77, 109, 0.25);
        }
        button:hover {
            background: #c9184a;
            transform: translateY(-2px);
        }
        .display-box {
            min-height: 60px;
            padding: 12px;
            background: #fff0f3;
            border-radius: 12px;
            border-left: 4px solid #ff4d6d;
            font-style: italic;
            font-size: 0.9rem;
            color: #590d22;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .why-you-section {
            border-top: 1px dashed #ffb3c1;
            padding-top: 18px;
        }
        .why-you-section h2 {
            color: #ff4d6d;
            font-size: 1.2rem;
            margin-bottom: 12px;
        }
        .photo-card {
            margin-top: 15px;
            padding: 10px;
            background: #fff5f6;
            border-radius: 15px;
            display: none;
            animation: fadeIn 0.4s ease-in-out;
        }
        .photo-card img {
            width: 100%;
            max-height: 220px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 8px;
        }
        .photo-card p {
            font-size: 0.9rem;
            font-weight: 500;
            color: #590d22;
        }
        
        /* Admin Link Generator Box */
        .admin-panel {
            margin-top: 25px;
            padding: 15px;
            background: #f8f9fa;
            border: 1px solid #ffd1dc;
            border-radius: 12px;
            text-align: left;
        }
        .admin-panel h3 {
            font-size: 0.95rem;
            color: #ff4d6d;
            margin-bottom: 8px;
        }
        .admin-panel input {
            width: 100%;
            padding: 8px;
            margin-bottom: 8px;
            border: 1px solid #ffccd5;
            border-radius: 6px;
            font-size: 0.85rem;
        }
        .admin-panel button {
            width: 100%;
            padding: 8px;
        }
        .generated-url {
            margin-top: 8px;
            word-break: break-all;
            font-size: 0.8rem;
            color: #0077b6;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

<!-- Floating Background Hearts -->
<div class="heart-bg">
    <div class="floating-heart" style="left: 10%; animation-delay: 0s;">❤️</div>
    <div class="floating-heart down" style="left: 25%; animation-delay: 2s;">💖</div>
    <div class="floating-heart" style="left: 45%; animation-delay: 4s;">💕</div>
    <div class="floating-heart down" style="left: 65%; animation-delay: 1s;">❤️</div>
    <div class="floating-heart" style="left: 80%; animation-delay: 3s;">💗</div>
    <div class="floating-heart down" style="left: 90%; animation-delay: 5s;">❤️</div>
</div>

<div class="container">
    <div class="couplename" id="headingTitle">
        <span id="senderName">I</span> ❤️ <span id="partnerName">You</span>
    </div>
    <p class="special-quote">"I can't live without you ❤️"</p>
    <p class="main-message">Tum meri zindagi ka sabse khubsurat hissa ho...</p>

    <!-- Shayari Section -->
    <div class="btn-group">
        <button onclick="showShayari(1)">Pyari Shayari ✨</button>
        <button onclick="showShayari(2)">Pyaar Bhari Baatein 💌</button>
    </div>

    <div class="display-box" id="shayariBox">
        Upar kisi shayari button par click karein...
    </div>

    <!-- Why You Section -->
    <div class="why-you-section">
        <h2>Why You?</h2>
        <div class="btn-group">
            <button onclick="showPhoto('smile')">Your Smile 😊</button>
            <button onclick="showPhoto('eyes')">Your Eyes 👀</button>
            <button onclick="showPhoto('masti')">Your Masti 😜</button>
            <button onclick="showPhoto('other')">Other ✨</button>
        </div>

        <div class="photo-card" id="photoBox">
            <img id="displayImg" src="" alt="Memory">
            <p id="imgCaption"></p>
        </div>
    </div>

    <!-- Generator Section (Only visible on main site) -->
    <div class="admin-panel" id="adminBox">
        <h3>🔗 Custom Link Banayein (Sirf Aapke Liye):</h3>
        <input type="text" id="inputMyName" placeholder="Aapka Naam (e.g. Shankar)">
        <input type="text" id="inputPartnerName" placeholder="Partner ka Naam">
        <button onclick="createShareLink()">Link Generate Karein</button>
        <div class="generated-url" id="linkOutput"></div>
    </div>
</div>

<script>
    // 1. Read URL Parameters
    const urlParams = new URLSearchParams(window.location.search);
    const partner = urlParams.get('to');
    const sender = urlParams.get('from');

    if (partner) {
        document.getElementById('partnerName').innerText = partner;
        if (sender) {
            document.getElementById('senderName').innerText = sender;
        }
        // Link kholne wale ko generator hide kar do
        document.getElementById('adminBox').style.display = 'none';
    }

    // 2. Link Generator Function
    function createShareLink() {
        const myName = document.getElementById('inputMyName').value.trim();
        const pName = document.getElementById('inputPartnerName').value.trim();

        if (!pName) {
            alert("Kripya Partner ka naam likhein!");
            return;
        }

        const baseUrl = window.location.origin + window.location.pathname;
        const finalUrl = `${baseUrl}?to=${encodeURIComponent(pName)}&from=${encodeURIComponent(myName || 'My Love')}`;

        document.getElementById('linkOutput').innerHTML = `
            <strong>Partner ko ye link bhejein:</strong><br>
            <a href="${finalUrl}" target="_blank">${finalUrl}</a>
        `;
    }

    // 3. Shayari Data
    const shayaris = {
        1: "Tere muskurane ka asar kuch aisa hua, ki dil ne dhadakna chhod kar sirf tujhe chaha...",
        2: "Zindagi ki har subah khoobsurat lagti hai, jab se tum meri zindagi ka hissa bane ho..."
    };

    function showShayari(id) {
        document.getElementById('shayariBox').innerText = shayaris[id];
    }

    // 4. Photo Data
    const mediaData = {
        smile: {
            img: "https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=500&q=80",
            caption: "Tumhari ek muskaan mere pure din ko roshan kar deti hai 😊"
        },
        eyes: {
            img: "https://images.unsplash.com/photo-1544005313-94ddf0286df2?auto=format&fit=crop&w=500&q=80",
            caption: "In khoobsurat aankhon mein doob jane ka mann karta hai 👀❤️"
        },
        masti: {
            img: "https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=500&q=80",
            caption: "Tumhari natkhat aur pagal si baatein hi meri sabse badi khushi hain 😜"
        },
        other: {
            img: "https://images.unsplash.com/photo-1518199266791-5375a83190b7?auto=format&fit=crop&w=500&q=80",
            caption: "Bas tumhara hona hi meri zindagi ko mukammal banata hai ✨"
        }
    };

    function showPhoto(category) {
        const photoBox = document.getElementById('photoBox');
        const img = document.getElementById('displayImg');
        const caption = document.getElementById('imgCaption');

        img.src = mediaData[category].img;
        caption.innerText = mediaData[category].caption;
        photoBox.style.display = 'block';
    }
</script>

</body>
</html>
